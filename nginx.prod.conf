# ─────────────────────────────────────────────────────────────────────────────
# Nginx production — Passidoc
# Remplacer passidoc.afym.re par le vrai domaine
# ─────────────────────────────────────────────────────────────────────────────

# Redirection HTTP → HTTPS
server {
    listen 80;
    server_name passidoc.afym.re;

    # Challenge Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name passidoc.afym.re;

    ssl_certificate     /etc/nginx/ssl/live/passidoc.afym.re/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/passidoc.afym.re/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    # Upload taille max (documents clients)
    client_max_body_size 50M;

    # Angular — SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API backend
    location /api {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Cache assets statiques (Angular génère des hash dans les noms de fichiers)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
